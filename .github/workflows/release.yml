# Cuts a release from the branch or tag this workflow is run against: tests it, creates the tag and
# the GitHub release, then moves the major tag consumers pin (`v1`) to the same commit.
#
#   gh workflow run release.yml -f version=v1.2.3
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as vMAJOR.MINOR.PATCH (e.g. v1.2.3).'
        type: string
        required: true
      prerelease:
        description: 'Mark as a pre-release and leave the major tag where it is.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          # Nothing to install, so the cache would only be an attack surface on a release job.
          package-manager-cache: false

      - name: Check the version is releasable
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not vMAJOR.MINOR.PATCH." >&2; exit 1 ;;
          esac
          if gh api "repos/$REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists." >&2
            exit 1
          fi

      # The major tag is what everyone runs, so nothing is tagged from a commit that fails here.
      - run: npm test

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--target "$SHA" --title "$VERSION" --generate-notes)
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}"

      - name: Point the major tag at this release
        if: ${{ !inputs.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          major="${VERSION%%.*}"
          if gh api "repos/$REPO/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$major" -f "sha=$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/$major" -f "sha=$SHA" >/dev/null
          fi
          echo "Released $VERSION and moved $major to $SHA" >> "$GITHUB_STEP_SUMMARY"
